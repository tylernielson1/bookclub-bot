services:
  bot:
    container_name: bookclub-bot
    image: bookclub-bot
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  
  redis:
    container_name: bookclub-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data: